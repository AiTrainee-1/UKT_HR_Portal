name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uktex_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: uktex_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DEBUG: "true"
      JWT_SECRET: ci-only-jwt-secret
      DJANGO_SECRET_KEY: ci-only-django-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter constraints.txt was generated on.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
            backend/requirements-dev.txt
      - name: Install dependencies (exact versions)
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - name: Lint (ruff)
        run: ruff check .
      # Railway runs Python 3.13 while this job runs 3.14. 3.14-only syntax
      # (e.g. `except A, B:`) compiles here but crashes production at startup.
      - uses: actions/setup-python@v5
        id: py313
        with:
          python-version: "3.13"
          update-environment: false
      - name: Byte-compile on the production Python (3.13)
        run: ${{ steps.py313.outputs.python-path }} -m compileall -q api config manage.py
      - name: Format (files listed in .format-enforced must be ruff-clean)
        run: xargs -a .format-enforced ruff format --check
      - name: Django system check
        run: python manage.py check
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run test suite with coverage
        run: coverage run manage.py test api -v 1
      - name: Coverage minimum (fail_under in pyproject.toml)
        run: coverage report

  frontend:
    name: Frontend lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint, warning count may not grow)
        run: npm run lint
      - name: Format (curated files must be prettier-clean)
        run: npm run format:check
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests with coverage minimum
        run: npm run test:coverage
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # playwright.config.ts starts the backend against a throwaway uktex_e2e
      # database that backend/e2e_setup.py drops, migrates and seeds.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run end-to-end tests
        run: npx playwright test
        working-directory: frontend
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
